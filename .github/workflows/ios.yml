name: StormVR iPhone

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Source/ios/**
      - Source/pc_driver/common/protocol.h
      - .github/workflows/ios.yml

permissions:
  contents: read

jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compilar e empacotar IPA sem assinatura
        run: bash Source/ios/scripts/package-unsigned.sh "$RUNNER_TEMP/StormVR-unsigned.ipa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: StormVR-unsigned
          path: ${{ runner.temp }}/StormVR-unsigned.ipa
          if-no-files-found: error
